name: factory/intro
title: Intro
description: An introductory section with text alongside an image, optionally with a stats sidebar.
group: factory
icon: content-text
fields:
  - identifier: variant
    type: Select
    renderType: selectSingle
    label: Variant
    items:
      - { label: Text left · image right, value: text-left }
      - { label: Text right · image left, value: text-right }
      - { label: Centered · image below, value: centered }
      - { label: Stacked with stats sidebar, value: stacked }
    default: text-left

  - identifier: eyebrow
    type: Text
    label: Eyebrow

  - identifier: title
    type: Text
    label: Title
    description: Main heading. Use <strong>…</strong> to emphasise part of the title in the accent color.

  - identifier: body
    type: Textarea
    label: Body
    description: "Plain text. Inline <strong>…</strong>, <a href=\"…\">…</a> and <span class=\"accent\">…</span> (brand colour) are kept; nothing else."
    enableRichtext: false

  - identifier: image
    type: File
    label: Image
    maxItems: 1
    allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp']

  - identifier: image_alt
    type: Text
    label: Image alt text override
    description: Defaults to the file's metadata alt text.

  - identifier: cta_label
    type: Text
    label: CTA Label

  - identifier: cta_to
    type: Link
    label: CTA Link

  # The button's style (Atoms / Button Style). Empty = the block's own default; a
  # Figma export sets it from its `buttons` channel (DL #075).
  - identifier: cta_variant
    type: Select
    renderType: selectSingle
    label: CTA Style
    items:
      - { label: 'Default (outline)', value: '' }
      - { label: Solid, value: solid }
      - { label: Outline, value: outline }
      - { label: Ghost, value: ghost }
      - { label: Outline on dark, value: outline-white }
      - { label: White solid, value: white-solid }
    default: ''

  - identifier: stats_eyebrow
    type: Text
    label: Stats Sidebar Eyebrow
    description: Label above the stats sidebar (stacked variant only).
    default: In Zahlen
    displayCond: 'FIELD:variant:=:stacked'

  - identifier: stats
    type: Collection
    label: Stats (stacked variant)
    description: Key numbers shown in the sidebar of the stacked variant.
    displayCond: 'FIELD:variant:=:stacked'
    fields:
      - identifier: value
        type: Text
        label: Value (e.g. 40+, 98%)
      - identifier: label
        type: Text
        label: Label

  - identifier: heading_level
    type: Select
    renderType: selectSingle
    label: Heading level
    description: Which HTML heading this section's main headline renders as. Use H1 once per page — the chat's SEO check reports duplicates.
    items:
      - { label: 'H1 — main page heading', value: h1 }
      - { label: 'H2 — section heading', value: h2 }
      - { label: 'H3 — sub-section', value: h3 }
    default: h2
