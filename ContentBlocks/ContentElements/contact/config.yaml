name: factory/contact
title: Contact
description: Contact section with info block + form. Variants — split, stacked (centered), tiles, contact persons, split-with-image.
group: factory
icon: content-textmedia
fields:
  - identifier: variant
    type: Select
    renderType: selectSingle
    label: Variant
    items:
      - { label: Split · info left + form right, value: split }
      - { label: Stacked · info top + centered form, value: stacked }
      - { label: Tiles · 3 info tiles, value: tiles }
      - { label: Contact persons, value: persons }
      - { label: Split with image · photo left, value: split-image }
    default: split

  # Appearance switches (DL #063 D1) — the design's Info Icons / Divider / Link /
  # Phone / Subject toggles. On by default, so stored content keeps its look.
  - identifier: show_info_icons
    type: Checkbox
    label: Show info icons
    default: 1
    displayCond: 'FIELD:variant:IN:split,stacked,tiles,persons'
  - identifier: show_divider
    type: Checkbox
    label: Show divider above and below the info band
    default: 1
    displayCond: 'FIELD:variant:=:stacked'
  - identifier: show_tile_links
    type: Checkbox
    label: Show tile links (route, call, e-mail)
    default: 1
    displayCond: 'FIELD:variant:=:tiles'
  - identifier: show_phone_field
    type: Checkbox
    label: Show phone field in the form
    default: 1
    displayCond: 'FIELD:variant:IN:split,stacked,split-image'
  - identifier: show_subject_field
    type: Checkbox
    label: Show subject field in the form
    default: 1
    displayCond: 'FIELD:variant:IN:split,stacked,split-image'

  - identifier: eyebrow
    type: Text
    label: Eyebrow

  - identifier: headline
    type: Text
    label: Headline

  - identifier: intro
    type: Textarea
    label: Intro

  - identifier: org
    type: Text
    label: Organisation name

  - identifier: address_street
    type: Text
    label: Street
  - identifier: address_zip
    type: Text
    label: ZIP
    size: 10
  - identifier: address_city
    type: Text
    label: City

  - identifier: phone
    type: Text
    label: Phone (display)
    description: 'Spaces allowed — tel: link is auto-stripped.'

  - identifier: email
    type: Email
    label: Email

  - identifier: hours
    type: Text
    label: Opening hours

  - identifier: linkedin_url
    type: Link
    label: LinkedIn URL
  - identifier: instagram_url
    type: Link
    label: Instagram URL

  - identifier: success_text
    type: Textarea
    label: Success message
    default: Danke! Wir melden uns innerhalb eines Werktags bei Ihnen.

  - identifier: form_endpoint
    type: Text
    label: Form POST endpoint
    description: 'Optional URL to POST the contact form to. Leave empty to keep the demo / no-op behaviour.'

  - identifier: privacy_link
    type: Link
    label: Privacy policy link

  - identifier: photo
    type: File
    label: Photo (split-image variant)
    maxItems: 1
    allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp']
    displayCond: 'FIELD:variant:=:split-image'

  - identifier: persons
    type: Collection
    label: Contact persons
    displayCond: 'FIELD:variant:=:persons'
    fields:
      - identifier: name
        type: Text
        label: Name
        required: true
      - identifier: role
        type: Text
        label: Role
      - identifier: email
        type: Email
        label: Email
      - identifier: phone
        type: Text
        label: Phone
      - identifier: photo
        type: File
        label: Photo
        maxItems: 1
        allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp']

  - identifier: heading_level
    type: Select
    renderType: selectSingle
    label: Heading level
    description: Which HTML heading this section's main headline renders as. Use H1 once per page — the chat's SEO check reports duplicates.
    items:
      - { label: 'H1 — main page heading', value: h1 }
      - { label: 'H2 — section heading', value: h2 }
      - { label: 'H3 — sub-section', value: h3 }
    default: h2
