name: factory/blocks
title: Blocks
description: Searchable / filterable content blocks (knowledge base, glossary, articles). Variants with category pills, dropdown filters, or magazine layout.
group: factory
icon: content-special-html
fields:
  - identifier: variant
    type: Select
    renderType: selectSingle
    label: Variant
    items:
      - { label: 'Cards · with category pills', value: cards-pills }
      - { label: 'Cards · with category tabs', value: cards-tabs }
      - { label: 'Compact cards · with pills', value: compact-pills }
      - { label: 'Compact cards · with tabs', value: compact-tabs }
      - { label: 'List · with dropdown filters + sort', value: list-dropdown }
      - { label: 'Magazine · 1 featured + 4 small + pills', value: magazine-pills }
    default: cards-pills

  - identifier: eyebrow
    type: Text
    label: Eyebrow
  - identifier: headline
    type: Text
    label: Headline
  - identifier: intro
    type: Textarea
    label: Intro

  - identifier: categories
    type: Textarea
    label: Categories (one per line)
    description: Used by the pill / tab / dropdown filters. Must match the category set on each block.

  - identifier: types
    type: Textarea
    label: Types (one per line)
    description: Used by the list-dropdown variant.

  - identifier: search_placeholder
    type: Text
    label: Search placeholder
    default: 'Suchen …'

  - identifier: per_page
    type: Number
    label: Items per page
    description: Empty = the layout's default (cards 6, compact 9, list 8, magazine 5).

  - identifier: show_toolbar
    type: Checkbox
    label: Show toolbar (search + sort)
    default: 1
  - identifier: show_search
    type: Checkbox
    label: Show search
    default: 1
  - identifier: show_sort
    type: Checkbox
    label: Show sort
    default: 1
  - identifier: show_category
    type: Checkbox
    label: Show category label
    description: Hides the category tag only — filtering by category keeps working.
    default: 1
  - identifier: show_meta
    type: Checkbox
    label: Show meta line (type, date, read time)
    description: Hides the meta line only — sorting and the type filter keep working.
    default: 1

  - identifier: items
    type: Collection
    label: Blocks / Articles
    minitems: 1
    fields:
      - identifier: title
        type: Text
        label: Title
        required: true
      - identifier: excerpt
        type: Textarea
        label: Excerpt
      - identifier: category
        type: Text
        label: Category (must be in Categories above)
      - identifier: type
        type: Text
        label: Type
      - identifier: date
        type: DateTime
        format: date
        label: Date
      - identifier: read_time
        type: Number
        label: Read time (minutes)
      - identifier: image
        type: File
        label: Image
        maxItems: 1
        allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp']
      - identifier: link
        type: Link
        label: Read-more link

  - identifier: heading_level
    type: Select
    renderType: selectSingle
    label: Heading level
    description: Which HTML heading this section's main headline renders as. Use H1 once per page — the chat's SEO check reports duplicates.
    items:
      - { label: 'H1 — main page heading', value: h1 }
      - { label: 'H2 — section heading', value: h2 }
      - { label: 'H3 — sub-section', value: h3 }
    default: h2
