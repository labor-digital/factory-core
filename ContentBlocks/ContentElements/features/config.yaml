name: factory/features
title: Features
description: A grid of feature/service cards with optional icon, image, number, or simple flat layout.
group: factory
icon: content-text
fields:
  - identifier: variant
    type: Select
    renderType: selectSingle
    label: Variant
    items:
      - { label: Cards (3-col with icon and link), value: cards }
      - { label: 'Flat (3-col minimal, top border)', value: flat }
      - { label: Numbered (big numbers), value: numbered }
      - { label: Media (with image), value: media }
    default: cards

  # pos268 Columns axis (DL #073): auto = 3 / 2 / 1 per row (desktop / tablet /
  # mobile); 3-1-1 = three on desktop, one per row below.
  - identifier: columns
    type: Select
    renderType: selectSingle
    label: Columns
    items:
      - { label: 'Auto (3, 2 on tablet, 1 on mobile)', value: auto }
      - { label: '3 on desktop, 1 below', value: 3-1-1 }
    default: auto

  # Atom switches on Atoms / Feature Card (DL #063 D1). Both were drawn
  # unconditionally before, so they default on.
  - identifier: show_top_rule
    type: Checkbox
    label: Show top rule (Flat)
    default: 1

  - identifier: show_divider
    type: Checkbox
    label: Show divider between items (Numbered)
    default: 1

  - identifier: eyebrow
    type: Text
    label: Eyebrow

  - identifier: headline
    type: Text
    label: Headline

  - identifier: intro
    type: Textarea
    label: Intro
    description: "Plain text. Inline <strong>…</strong>, <a href=\"…\">…</a>, <span class=\"accent\">…</span> (brand colour) and <mark data-tone=\"peach\">…</mark> (highlight pill; tones peach, marigold, coral, sky, blue, midnight, white) are kept; nothing else."

  - identifier: items
    type: Collection
    label: Items
    minitems: 1
    fields:
      - identifier: num
        type: Text
        label: Number (e.g. 01)
        description: Used by Numbered and Media variants. Auto-numbered if empty.
      - identifier: title
        type: Text
        label: Title
      - identifier: text
        type: Textarea
        label: Text
        description: "Plain text. Inline <strong>…</strong>, <a href=\"…\">…</a>, <span class=\"accent\">…</span> (brand colour) and <mark data-tone=\"peach\">…</mark> (highlight pill; tones peach, marigold, coral, sky, blue, midnight, white) are kept; nothing else."
      - identifier: icon
        type: Text
        label: Icon (Iconify name, e.g. i-lucide-star)
        description: Used by Cards / Flat variants.
      - identifier: image
        type: File
        label: Image
        description: Used by Media variant.
        allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp', 'svg']
        maxItems: 1
      - identifier: link_label
        type: Text
        label: Link Label
      - identifier: link_to
        type: Link
        label: Link Target
      # Card colour (DL #080): a named tone from the layer's --tone-* tokens. Empty =
      # the variant's own look. Cards and Media variants only.
      - identifier: tone
        type: Select
        renderType: selectSingle
        label: Card colour
        description: Background colour of this card (Cards and Media variants). Default = the variant's look.
        items:
          - { label: Default, value: '' }
          - { label: Peach, value: peach }
          - { label: Marigold, value: marigold }
          - { label: Coral, value: coral }
          - { label: Sky, value: sky }
          - { label: Blue, value: blue }
          - { label: Midnight, value: midnight }
          - { label: White, value: white }
        default: ''

  - identifier: band_button_label
    type: Text
    label: Band Button Label
    description: Optional centered outline button below the grid. Leave empty to hide it.

  - identifier: band_button_to
    type: Link
    label: Band Button Link

  # The button's style (Atoms / Button Style). Empty = the block's own default; a
  # Figma export sets it from its `buttons` channel (DL #075).
  - identifier: band_button_variant
    type: Select
    renderType: selectSingle
    label: Band Button Style
    items:
      - { label: 'Default (outline)', value: '' }
      - { label: Solid, value: solid }
      - { label: Outline, value: outline }
      - { label: Ghost, value: ghost }
      - { label: Outline on dark, value: outline-white }
      - { label: White solid, value: white-solid }
    default: ''

  - identifier: heading_level
    type: Select
    renderType: selectSingle
    label: Heading level
    description: Which HTML heading this section's main headline renders as. Use H1 once per page — the chat's SEO check reports duplicates.
    items:
      - { label: 'H1 — main page heading', value: h1 }
      - { label: 'H2 — section heading', value: h2 }
      - { label: 'H3 — sub-section', value: h3 }
    default: h2

  # Design overrides (DL #063 D3) — "default" keeps the variant's library look.
  - identifier: heading_size
    type: Select
    renderType: selectSingle
    label: Headline size
    description: Default = the variant's own size; H1–H3 use the site's type scale (DL #065).
    items:
      - { label: Default, value: default }
      - { label: H1, value: h1 }
      - { label: H2, value: h2 }
      - { label: H3, value: h3 }
    default: default
  - identifier: content_align
    type: Select
    renderType: selectSingle
    label: Content alignment
    description: Aligns the section head and the cards together. Default = the variant's look (Flat centres the head, cards are left-aligned).
    items:
      - { label: Default, value: default }
      - { label: Left, value: left }
      - { label: Center, value: center }
    default: default

  - identifier: heading_case
    type: Select
    renderType: selectSingle
    label: Headline case
    items:
      - { label: Default, value: default }
      - { label: Uppercase, value: upper }
    default: default

  - identifier: heading_weight
    type: Select
    renderType: selectSingle
    label: Headline weight
    items:
      - { label: Default, value: default }
      - { label: Light, value: light }
      - { label: Bold, value: bold }
    default: default
