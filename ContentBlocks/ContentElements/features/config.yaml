name: factory/features
title: Features
description: A grid of feature/service cards with optional icon, image, number, or simple flat layout.
group: factory
icon: content-text
fields:
  - identifier: variant
    type: Select
    renderType: selectSingle
    label: Variant
    items:
      - { label: Cards (3-col with icon and link), value: cards }
      - { label: 'Flat (3-col minimal, top border)', value: flat }
      - { label: Numbered (big numbers), value: numbered }
      - { label: Media (with image), value: media }
    default: cards

  # Atom switches on Atoms / Feature Card (DL #063 D1). Both were drawn
  # unconditionally before, so they default on.
  - identifier: show_top_rule
    type: Checkbox
    label: Show top rule (Flat)
    default: 1

  - identifier: show_divider
    type: Checkbox
    label: Show divider between items (Numbered)
    default: 1

  - identifier: eyebrow
    type: Text
    label: Eyebrow

  - identifier: headline
    type: Text
    label: Headline

  - identifier: intro
    type: Textarea
    label: Intro

  - identifier: items
    type: Collection
    label: Items
    minitems: 1
    fields:
      - identifier: num
        type: Text
        label: Number (e.g. 01)
        description: Used by Numbered and Media variants. Auto-numbered if empty.
      - identifier: title
        type: Text
        label: Title
      - identifier: text
        type: Textarea
        label: Text
      - identifier: icon
        type: Text
        label: Icon (Iconify name, e.g. i-lucide-star)
        description: Used by Cards / Flat variants.
      - identifier: image
        type: File
        label: Image
        description: Used by Media variant.
        allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp', 'svg']
        maxItems: 1
      - identifier: link_label
        type: Text
        label: Link Label
      - identifier: link_to
        type: Link
        label: Link Target

  - identifier: band_button_label
    type: Text
    label: Band Button Label
    description: Optional centered outline button below the grid. Leave empty to hide it.

  - identifier: band_button_to
    type: Link
    label: Band Button Link

  - identifier: heading_level
    type: Select
    renderType: selectSingle
    label: Heading level
    description: Which HTML heading this section's main headline renders as. Use H1 once per page — the chat's SEO check reports duplicates.
    items:
      - { label: 'H1 — main page heading', value: h1 }
      - { label: 'H2 — section heading', value: h2 }
      - { label: 'H3 — sub-section', value: h3 }
    default: h2

  # Design overrides (DL #063 D3) — "default" keeps the variant's library look.
  - identifier: content_align
    type: Select
    renderType: selectSingle
    label: Content alignment
    description: Aligns the section head and the cards together. Default = the variant's look (Flat centres the head, cards are left-aligned).
    items:
      - { label: Default, value: default }
      - { label: Left, value: left }
      - { label: Center, value: center }
    default: default

  - identifier: heading_case
    type: Select
    renderType: selectSingle
    label: Headline case
    items:
      - { label: Default, value: default }
      - { label: Uppercase, value: upper }
    default: default

  - identifier: heading_weight
    type: Select
    renderType: selectSingle
    label: Headline weight
    items:
      - { label: Default, value: default }
      - { label: Light, value: light }
      - { label: Bold, value: bold }
    default: default
