name: factory/text
title: Text
description: A simple text section with eyebrow, title, subline, body, and up to two CTAs.
group: factory
icon: content-text
fields:
  - identifier: variant
    type: Select
    renderType: selectSingle
    label: Variant
    items:
      - { label: Left-aligned, value: left }
      - { label: Centered, value: center }
      - { label: 'Two-column (title left · body right)', value: two-col }
      - { label: Oversize (huge headline breaks the grid), value: oversize }
    default: left

  - identifier: eyebrow
    type: Text
    label: Eyebrow

  - identifier: title
    type: Text
    label: Title
    description: Main heading. Use <strong>…</strong> to emphasise part of the title in the accent color.

  - identifier: subline
    type: Text
    label: Subline
    description: Short sentence between title and body.

  - identifier: body
    type: Textarea
    label: Body

  - identifier: contact_org
    type: Text
    label: Contact Organisation
    description: Optional bold organisation name of a contact block below the body. Leave empty to hide it.

  - identifier: contact_lines
    type: Textarea
    label: Contact Lines
    description: Optional contact block lines (address, phone, e-mail) — one per line. Leave empty to hide them.

  - identifier: primary_label
    type: Text
    label: Primary CTA Label

  - identifier: primary_to
    type: Link
    label: Primary CTA Link

  - identifier: secondary_label
    type: Text
    label: Secondary CTA Label

  - identifier: secondary_to
    type: Link
    label: Secondary CTA Link

  - identifier: heading_level
    type: Select
    renderType: selectSingle
    label: Heading level
    description: Which HTML heading this section's title renders as. Use H1 once per page — the chat's SEO check reports duplicates.
    items:
      - { label: 'H1 — main page heading', value: h1 }
      - { label: 'H2 — section heading', value: h2 }
      - { label: 'H3 — sub-section', value: h3 }
    default: h2

  # Design override (DL #063 D3) — "default" keeps the variant's library look.
  - identifier: heading_case
    type: Select
    renderType: selectSingle
    label: Title case
    items:
      - { label: Default, value: default }
      - { label: Uppercase, value: upper }
    default: default
